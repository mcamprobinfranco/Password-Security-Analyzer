services:
  backend:
    build:
      context: ./backend/password-analyzer
    container_name: password-analyzer-backend
    ports:
      - "8080:8080"
    networks:
      - password-analyzer-net

  frontend:
    build:
      context: ./frontend
    container_name: password-analyzer-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - password-analyzer-net

networks:
  password-analyzer-net:
    driver: bridge